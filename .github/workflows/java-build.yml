name: Java build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source tree exists
        run: |
          if [ ! -f src/com/fitness/Main.java ]; then
            echo '::error::Application source is missing. Commit src/com/fitness/Main.java and the rest of the Java source tree before building or deploying.'
            exit 1
          fi
      - name: Compile application
        run: |
          mkdir -p build
          find src -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -d build
